[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hannah"
version = "0.10.6"
description = "F1 strategy engineer for your LLM garage — repository analysis and model recommendations."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["llm", "ollama", "models", "strategy", "repo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
# Zero runtime dependencies — pure stdlib so the engine runs anywhere
# (Claude Code, Cowork, Codex, plain terminal) with no install step.
dependencies = []

[project.scripts]
hannah = "hannah.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hannah*"]
