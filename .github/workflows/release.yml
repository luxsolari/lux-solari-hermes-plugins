name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish or republish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve and validate tag syntax
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf '%s\n' 'Expected a canonical vX.Y.Z tag' >&2
            exit 1
          fi
          printf 'tag=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify tag identity and reviewed branch ancestry
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install -r requirements-dev.txt
      - name: Run offline checks
        run: python scripts/run_checks.py
      - name: Validate version and changelog
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: python scripts/validate_release.py "$TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Build source archive and checksums
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          NAME="lux-solari-hermes-plugins-$TAG"
          git archive --format=tar.gz --prefix="$NAME/" --output="$RUNNER_TEMP/$NAME.tar.gz" HEAD
          cd "$RUNNER_TEMP"
          sha256sum "$NAME.tar.gz" > SHA256SUMS
      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/lux-solari-hermes-plugins-$TAG.tar.gz" "$RUNNER_TEMP/SHA256SUMS" --clobber
            gh release edit "$TAG" --draft=false --prerelease=false --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" "$RUNNER_TEMP/lux-solari-hermes-plugins-$TAG.tar.gz" "$RUNNER_TEMP/SHA256SUMS" --verify-tag --draft=false --prerelease=false --target "$(git rev-parse HEAD)" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
